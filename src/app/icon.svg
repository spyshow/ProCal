<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Bolt Vibrant Gradient -->
    <linearGradient id="boltGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fb923c" />
      <stop offset="45%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="boltGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Base Icon Container (Rounded Squircle) -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="112"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="12"
  />

  <!-- Subtle Engineering Grid Lines -->
  <path
    d="M64 256 H448 M256 64 V448"
    stroke="#334155"
    stroke-width="2"
    stroke-dasharray="8 8"
    opacity="0.25"
  />
  <circle
    cx="256"
    cy="256"
    r="160"
    stroke="#38bdf8"
    stroke-width="2"
    stroke-dasharray="6 6"
    opacity="0.2"
    fill="none"
  />

  <!-- Glow Underlay -->
  <path
    d="M276 56 L124 284 H244 L220 456 L388 228 H276 Z"
    fill="#f97316"
    opacity="0.4"
    filter="url(#boltGlow)"
  />

  <!-- Sharp ProCal Lightning Bolt -->
  <path
    d="M276 56 L124 284 H244 L220 456 L388 228 H276 Z"
    fill="url(#boltGrad)"
    stroke="#fed7aa"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Highlight Sheen -->
  <path
    d="M276 56 L190 284 H244 L232 370 L340 228 H276 Z"
    fill="#ffffff"
    opacity="0.18"
  />
</svg>
