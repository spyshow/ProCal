services:
  db:
    image: postgres:16-alpine
    container_name: procal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: procal
      POSTGRES_PASSWORD: procal
      POSTGRES_DB: procal
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procal -d procal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Captured-lead notification relay (Approach B, the loop's notify step).
  # Mailpit = the maintained Mailhog successor — accepts unauthenticated SMTP
  # on 1025 and serves a web inbox on 8025. Dev only; prod uses a real relay.
  mail:
    image: axllent/mailpit
    container_name: procal-mail
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP relay for the app (src/lib/notify.ts)
      - "8025:8025"   # web inbox — http://localhost:8025 to read captured leads

volumes:
  pgdata:
