<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-b">
  <title id="title-b">ProCal Concept B - The Phase Delta</title>
  <g fill="#000000">
    <!-- Three identical phase conductors in 120° rotational equilibrium -->
    <!-- Arm 1 (Phase L1) -->
    <path d="M 128 32 L 216 184 H 176 L 115 78 Z" />
    <!-- Arm 2 (Phase L2) -->
    <path d="M 128 32 L 216 184 H 176 L 115 78 Z" transform="rotate(120 128.0 134.0)" />
    <!-- Arm 3 (Phase L3) -->
    <path d="M 128 32 L 216 184 H 176 L 115 78 Z" transform="rotate(240 128.0 134.0)" />
  </g>
</svg>