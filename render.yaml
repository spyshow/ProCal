services:
  - type: web
    name: procal-web
    runtime: node
    plan: free
    region: frankfurt
    # NOTE: no `prisma/seed.ts` here on purpose. Seeding on every deploy used
    # to re-create the documented bootstrap admin with a publicly-known
    # password. Seed ONCE via a manual shell/job instead:
    #   npx tsx prisma/seed.ts
    # The script is guarded (no-op when an ADMIN already exists) and takes the
    # password from SEED_ADMIN_PASSWORD or prints a random one once.
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.18.0
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: procal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: LEADS_TO_ADDRESS
        sync: false

databases:
  - name: procal-db
    plan: free
    region: frankfurt
    databaseName: procal
    user: procal
